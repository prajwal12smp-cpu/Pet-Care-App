<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care - Sign Up</title>
    <link rel="stylesheet" href="/assets/login.css">
    <script type="module" src="signup.js"></script>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2>Sign Up</h2>
        </div>

        <form>
            <div id="signupMessage" class="messageDiv" style="display:none;"></div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
            </div>

            <button type="submit" name="signup" id="signup">Sign Up</button>

            <div class="seperator"><hr></div>
            <a href="login.html" id="login-btn">Already have an account?</a>
        </form>
    </div>
</body>
</html>
