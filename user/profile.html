<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care - Profile</title>
    <link rel="stylesheet" href="/assets/profile.css">
    <script type="module" src="/scripts/logout.js"></script>
    <script type="module" src="/scripts/profile.js"></script>
</head>
<body>
    <header>
        <div class="brand">
            <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Pet Health Logo" class="logo">
            <h1>Pet Health Care Support</h1>
        </div>
        <nav>
            <a href="home.html">Home</a>
            <a href="clinicstore.html">Clinics and Stores</a>
            <a href="resources.html">Resources</a>
            <a href="askai.html">Ask AI</a>
            <a href="profile.html" class="active">Profile</a>
            <button type="button" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2 class="page-title">Pet Profile</h2>

            <div class="alert" role="status"></div>

            <form id="petform">
                <div class="field">
                    <label for="petname">Pet Name</label>
                    <input type="text" id="petname" name="petname" required>
                </div>
                <div class="field">
                    <label for="ownername">Owner Name</label>
                    <input type="text" id="ownername" name="ownername" required>
                </div>
                <div class="field">
                    <label for="species">Species</label>
                    <input type="text" id="species" name="species" required>
                </div>
                <div class="field">
                    <label for="breed">Breed</label>
                    <input type="text" id="breed" name="breed" required>
                </div>
                <div class="field">
                    <label for="age">Age (years)</label>
                    <input type="number" id="age" name="age" min="0" step="any" required>
                </div>
                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Unknown">Unknown</option>
                    </select>
                </div>
                <div class="field">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" name="weight" min="0" step="any" required>
                </div>
                <div class="field">
                    <label for="pnumber">Phone Number</label>
                    <input type="tel" id="pnumber" name="pnumber" required>
                </div>
                <div class="field full">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <div class="field full">
                    <label for="vaccines">Vaccines</label>
                    <input type="text" id="vaccines" name="vaccines" required>
                </div>
                <div class="field full">
                    <label for="medicalhistory">Medical History</label>
                    <textarea id="medicalhistory" name="medicalhistory" rows="5"></textarea>
                </div>
                <button type="submit" id="save-button" class="full">Save</button>
            </form>

            <div id="pet-details-display" hidden>
                <div class="details-grid">
                    <div class="detail"><span class="detail-label">Pet Name</span><span id="display-petname"></span></div>
                    <div class="detail"><span class="detail-label">Owner Name</span><span id="display-ownername"></span></div>
                    <div class="detail"><span class="detail-label">Species</span><span id="display-species"></span></div>
                    <div class="detail"><span class="detail-label">Breed</span><span id="display-breed"></span></div>
                    <div class="detail"><span class="detail-label">Age</span><span id="display-age"></span></div>
                    <div class="detail"><span class="detail-label">Gender</span><span id="display-gender"></span></div>
                    <div class="detail"><span class="detail-label">Weight</span><span id="display-weight"></span></div>
                    <div class="detail"><span class="detail-label">Phone Number</span><span id="display-pnumber"></span></div>
                    <div class="detail full"><span class="detail-label">Address</span><span id="display-address"></span></div>
                    <div class="detail full"><span class="detail-label">Vaccines</span><span id="display-vaccines"></span></div>
                    <div class="detail full"><span class="detail-label">Medical History</span><span id="display-medicalhistory"></span></div>
                </div>
                <button type="button" id="edit-button">Edit Profile</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Pet Care Support. All rights reserved.</p>
        <p>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms and Conditions</a>
            <a href="#">Contact Us</a>
        </p>
    </footer>
</body>
</html>
